name: Site check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev for production pull requests
        if: github.event_name == 'pull_request' && github.head_ref != 'dev'
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site from canonical source
        run: python scripts/sync_sites.py . "$RUNNER_TEMP/mogrov-site"
      - name: Check generated site
        run: python scripts/check_site.py "$RUNNER_TEMP/mogrov-site"
      - name: Check published snapshot
        run: diff -qr public "$RUNNER_TEMP/mogrov-site"
